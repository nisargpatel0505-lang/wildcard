name: WILDCARD official Flutter release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildcard-official-flutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Explicit dispatch only; the existing v* tag workflow builds Capacitor.
    if: github.ref == 'refs/heads/release/v9.1.0-astra'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: flutter_app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Restore official signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ../wildcard-release.keystore
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > ../keystore-password.txt
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze and test official configuration
        run: |
          set -euo pipefail
          mkdir -p build/official-delivery
          flutter analyze --no-pub 2>&1 | tee build/official-delivery/analyze.txt
          flutter test --no-pub --concurrency=2 2>&1 | tee build/official-delivery/tests.txt
      - name: Build official APK and AAB
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub
      - name: Verify identity, permissions and signatures
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          output=build/official-delivery
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer"
          test "$("$apkanalyzer" manifest application-id "$apk")" = 'com.nisarg.wildcard'
          test "$("$apkanalyzer" manifest version-code "$apk")" = '74'
          test "$("$apkanalyzer" manifest version-name "$apk")" = '9.1.0'
          "$apkanalyzer" manifest permissions "$apk" > "$output/permissions.txt"
          grep -Fxq 'android.permission.INTERNET' "$output/permissions.txt"
          grep -Fxq 'com.android.vending.BILLING' "$output/permissions.txt"
          "$apkanalyzer" manifest print "$apk" > "$output/AndroidManifest.xml"
          grep -Fq 'ca-app-pub-3855192091371080~7622357185' "$output/AndroidManifest.xml"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$output/apk-signature.txt"
          grep -Fq 'c3c281d1470aebf2d99656221ada7815c6b873f4e8a748d7284f5fae5d764717' "$output/apk-signature.txt"
          jarsigner -verify "$aab" > "$output/aab-signature-verification.txt"
          keytool -printcert -jarfile "$aab" > "$output/aab-certificate.txt"
          tr -d ':' < "$output/aab-certificate.txt" | tr '[:upper:]' '[:lower:]' | grep -Fq 'c3c281d1470aebf2d99656221ada7815c6b873f4e8a748d7284f5fae5d764717'
          cp "$apk" "$output/WILDCARD-v9.1.0-code74.apk"
          cp "$aab" "$output/WILDCARD-v9.1.0-code74.aab"
          git rev-parse HEAD > "$output/source-commit.txt"
          flutter --version > "$output/flutter-version.txt"
          sha256sum "$output"/*.apk "$output"/*.aab > "$output/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: WILDCARD-v9.1.0-code74-official
          path: flutter_app/build/official-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Remove restored signing files
        if: always()
        run: rm -f ../wildcard-release.keystore ../keystore-password.txt
